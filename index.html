  <style>
    /* -----------------------------------------------------------
       DISEÑO BASE Y ESTRUCTURA
    ----------------------------------------------------------- */
    body { font-family: sans-serif; margin: 0; background: #f4f4f4; padding-top: 220px; }
    .header { background: #fff; border-bottom: 2px solid #eee; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; box-sizing: border-box; }

    #buscador { width: 100%; padding: 10px; font-size: 1.1rem; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
  .filter-wrapper { 
      padding: 0 20px 10px 20px;
      display: flex;
      justify-content: flex-start; /* Alineado a la izquierda, o 'center' si preferís */
    }
    #filtro-categoria { 
      width: auto; /* Se ajusta al texto en pantallas grandes */

      max-width: 100%; 
      padding: 12px; 
      font-size: 1.1rem; 
      border: 2px solid #ddd; 
      border-radius: 8px; 
      background-color: #fff;

      font-family: 'Inter', sans-serif;

    .contenedor-principal { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; align-items: stretch; }
    
    .card-producto { padding: 12px; border: 1px solid #eee; border-radius: 10px; background: #fff; display: flex; flex-direction: column; min-height: 410px; height: auto; box-sizing: border-box; position: relative; }

    .contenedor-img img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    
    .lupa-zoom { display: none; position: absolute; top: 10px; right: 10px; background: #0070c0; color: white; width: 32px; height: 32px; border-radius: 50%; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; pointer-events: none; z-index: 5; box-shadow: 0 2px 5px rgba(0,0,0,0.2); line-height: 0; }
    
    .nombre-producto, .precio-text, .estado-stock, .estado-ultimos { text-align: center; }
    .categoria-tag { font-size: 0.6rem; color: #999; text-transform: uppercase; font-weight: 800; margin: 0; }
    .nombre-producto { font-size: 0.9rem; line-height: 1.2; height: 3.6em; margin: 4px 0 0 0; color: #222; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;text-align: center; }

    .precio-text { font-weight: bold; color: #27ae60; font-size: 1.25rem; margin-bottom: 3px; line-height: 1.2; }
    .estado-stock { color: #0070c0; font-weight: bold; font-size: 0.75rem; margin: 0; text-align: center; } /* AZUL */
    .estado-ultimos { color: #e74c3c; font-weight: bold; font-size: 0.75rem; margin: 0; text-align: center; } /* ROJO */
    .estado-pedido { color: #e67e22; font-weight: bold; font-size: 0.75rem; margin: 0; text-align: center; } /* NARANJA */

<script>
const WHATSAPP_DESTINO = "5493516148905";
const MINIMO_COMPRA = 0;
const URL_APPSCRIPT = "https://script.google.com/macros/s/AKfycbwdT-CPmMj6lvaMN1QpYyEBz-RARV4vhX0T99oIXrSqUSWMc2PfSWCI8VYczxRPPCuKGw/exec";

const CARRITO_KEY = "tao_carrito_v1";

let productos = [];
let filtrados = [];
let carrito = [];

/* --- PERSISTENCIA DEL CARRITO (sin login, localStorage del navegador) --- */
function guardarCarrito() {
  try {
    localStorage.setItem(CARRITO_KEY, JSON.stringify(carrito));
  } catch (e) { /* modo privado o storage lleno: el carrito sigue funcionando en memoria */ }
}

// Se llama DESPUES de cargar productos.json para reconciliar contra el catálogo vigente:
// si un producto ya no existe se descarta, y si cambió de precio/estado se actualiza.
function restaurarCarrito() {
  let guardado = [];
  try {
    guardado = JSON.parse(localStorage.getItem(CARRITO_KEY) || "[]");
  } catch (e) { guardado = []; }
  if (!Array.isArray(guardado)) return;

  carrito = guardado.reduce((acc, item) => {
    const p = productos.find(x => String(x.codigo) === String(item.codigo));
    if (!p) return acc; // ya no está en el catálogo
    const cant = parseInt(item.cantidad);
    if (!(cant >= 1)) return acc; // dato corrupto en el storage: se descarta el renglón
    acc.push({ ...p, cantidad: limitarCantidad(cant, p) }); // precio y estado siempre los del catálogo actual
    return acc;
  }, []);

  actualizarUI();
}

// Tope de cantidad para el carrito.
// Un ULTIMOS DISPONIBLES se topea en su stock real. Si viniera con stock 0 no se topea:
// stock 0 significa SIN stock y esos productos ya no deberían publicarse (pasan a estado 4),
// así que solo puede llegar acá por un productos.json viejo. Ante eso conviene dejar pedir
// —como hacía el sitio hasta ahora— antes que bloquear la venta.
function maximoPermitido(p) {
  const esUltimos = p.estado && p.estado.includes("ULTIMOS");
  const stock = Number(p.stock) || 0;
  return (esUltimos && stock > 0) ? stock : 999;
}

function limitarCantidad(cant, p) {
  return Math.min(cant, maximoPermitido(p));
}

async function cargar() {
  try {
    const res = await fetch('productos.json?v=' + Date.now());
    productos = await res.json();
    filtrados = productos;
    llenarCategorias(); // Esta función crea las opciones del menú
    render();
    restaurarCarrito();
  } catch (e) { console.error("Error al cargar productos:", e); }
}

function llenarCategorias() {
  const select = document.getElementById("filtro-categoria");
  // Esto saca las categorías de tu JSON automáticamente
  const categorias = [...new Set(productos.map(p => p.categoria))].filter(Boolean).sort();
  
  categorias.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    select.appendChild(opt);
  });
}

function obtenerImagen(url) {
  if (!url || url.includes('placeholder')) return 'img/placeholder.png';
  if (url.includes('drive.google.com')) {
    const id = url.match(/id=([\w-]+)|file\/d\/([\w-]+)/);
    const actualId = id ? (id[1] || id[2]) : null;
    return actualId ? `https://lh3.googleusercontent.com/u/0/d/${actualId}` : url;
  }
  return url;
}

function render() {
  const grid = document.getElementById("grid-productos");
  grid.innerHTML = "";
  filtrados.forEach(p => {
    const imgUrl = obtenerImagen(p.imagen);
    const maxS = p.estado === "ULTIMOS DISPONIBLES" ? (p.stock || 0) : 999; // sin cambios: el input de la tarjeta queda igual que antes
    let claseEst = "estado-pedido"; // Por defecto naranja
if (p.estado.includes("CON STOCK")) {
    claseEst = "estado-stock"; // Azul

function ampliarImagen(url) {
  const img = document.getElementById("img-ampliada");
  img.src = url;
  document.getElementById("lightbox").style.display = "flex";
}

function agregar(cod) {
  const p = productos.find(x => x.codigo === cod);
  const cant = parseInt(document.getElementById(`qty-${cod}`).value);
  if(isNaN(cant) || cant < 1) return;
  const ex = carrito.find(x => x.codigo === cod);
  if (ex) ex.cantidad = limitarCantidad(ex.cantidad + cant, p); else carrito.push({ ...p, cantidad: limitarCantidad(cant, p) });
  actualizarUI();
}

/* --- EDICION DE CANTIDADES DESDE EL CARRITO --- */
function cambiarCantidad(cod, delta) {
  const item = carrito.find(x => String(x.codigo) === String(cod));
  if (!item) return;
  fijarCantidad(cod, item.cantidad + delta);
}

function fijarCantidad(cod, valor) {
  const item = carrito.find(x => String(x.codigo) === String(cod));
  if (!item) return;
  const cant = parseInt(valor);
  if (isNaN(cant) || cant < 1) return quitar(cod); // bajar a 0 elimina el producto
  item.cantidad = limitarCantidad(cant, item);
  actualizarUI();
}

function actualizarUI() {
  const body = document.getElementById("carrito-body");
  let totalD = 0; let totalU = 0;
  body.innerHTML = "";
  carrito.forEach(i => {
    const sub = i.precio * i.cantidad;
    totalD += sub; totalU += i.cantidad;
    const max = maximoPermitido(i);
    body.innerHTML += `<tr style="border-bottom: 1px solid #eee;"><td style="padding:10px 0;">${i.nombre.substring(0,25)}...<br><small>Cód: ${i.codigo}</small></td><td style="text-align:center;"><div class="qty-carrito"><button class="qty-btn" aria-label="Restar uno" onclick="cambiarCantidad('${i.codigo}', -1)">&minus;</button><input class="qty-input" type="number" min="1" max="${max}" value="${i.cantidad}" onchange="fijarCantidad('${i.codigo}', this.value)" onfocus="this.select()"><button class="qty-btn" aria-label="Sumar uno" onclick="cambiarCantidad('${i.codigo}', 1)">+</button></div></td><td style="text-align:right;">$${sub.toLocaleString()}</td><td><button onclick="quitar('${i.codigo}')" style="color:red; border:none; background:none; cursor:pointer; padding-left:10px;">✕</button></td></tr>`;
  });
  let totalFinal = totalD;
  let etiquetaDescuento = "";

  if (totalD >= 100000) {
    totalFinal = totalD * 0.90;
    etiquetaDescuento = ` <br><small style="color:green; font-size:0.8rem;">(10% OFF Aplicado)</small>`;
  }

  document.getElementById("carrito-total").innerHTML = totalFinal.toLocaleString("es-AR") + etiquetaDescuento;
  document.getElementById("carrito-count").innerText = totalU;
  const msg = document.getElementById("msg-minimo");
  const btnWa = document.getElementById("btn-wa");
  if (totalD < MINIMO_COMPRA) {
    msg.innerHTML = `Faltan $${(MINIMO_COMPRA - totalD).toLocaleString()} para el mínimo.`;
    btnWa.style.opacity = "0.4"; btnWa.style.pointerEvents = "none";
  } else {
    msg.innerHTML = "✅ Mínimo alcanzado.";
    btnWa.style.opacity = "1"; btnWa.style.pointerEvents = "auto";
  }

  guardarCarrito(); // único punto de guardado: toda mutación pasa por acá
}

function quitar(cod) { carrito = carrito.filter(x => String(x.codigo) !== String(cod)); actualizarUI(); }

function abrirModalDatos() {
  if (carrito.length === 0) return alert("El carrito está vacío.");
  document.getElementById("modal-datos").style.display = "flex";
}

function cerrarModal() { document.getElementById("modal-datos").style.display = "none"; }

async function confirmarYEnviar() {
  const nombre = document.getElementById("nombre-cliente").value.trim();
  const tel = document.getElementById("tel-cliente").value.trim();
  if (!nombre || !tel) return alert("Por favor completa tu nombre y teléfono.");

const subtotal = carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0);
  let totalFinal = subtotal;
  let detalleDescuento = "";

  if (subtotal >= 100000) {
    totalFinal = subtotal * 0.90;
    detalleDescuento = `%0A*¡Descuento del 10% aplicado por superar los $100.000!*%0A`;
  }
  
  // Guardar en Google Sheets (Enviamos el total con descuento)
  try {
    fetch(URL_APPSCRIPT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cliente: nombre,
        telefono: tel,
        total: totalFinal, // Enviamos el total real
        carrito: carrito
      })
    });
  } catch (e) { console.error("Error Sheets:", e); }

  // WhatsApp Format
  let msg = `Hola MercadoTAO, soy *${nombre}* (Tel: ${tel}). Mi pedido es:%0A%0A`;
  carrito.forEach((i, idx) => {
    const st = i.precio * i.cantidad;
    msg += `${idx + 1}. *${i.nombre}*%0A Cód: ${i.codigo}  ${i.cantidad} x $${i.precio.toLocaleString()} = $${st.toLocaleString()}%0A%0A`;
  });

  msg += `--------------------------${detalleDescuento}`;
  msg += `%0A*TOTAL FINAL: $${totalFinal.toLocaleString()}*`;
  
  window.open(`https://wa.me/${WHATSAPP_DESTINO}?text=${msg}`);
  cerrarModal();
}

/* --- DESCARGA DE PDF COMPATIBLE CON MOVILES ---
   doc.save() falla o abre en blanco en varios navegadores móviles (Safari iOS en particular),
   así que generamos un blob y forzamos la descarga con un enlace temporal.
   En PC el resultado es idéntico al comportamiento anterior. */
function descargarPDF(doc, nombreArchivo) {
  try {
    const url = URL.createObjectURL(doc.output('blob'));
    const a = document.createElement('a');
    if ('download' in a) {
      a.href = url;
      a.download = nombreArchivo;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } else {
      window.open(url, '_blank'); // navegadores sin soporte del atributo download
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {
    doc.save(nombreArchivo); // último recurso: comportamiento original
  }
}

/* --- PDF PEDIDO CLIENTE --- */
function generarPDFPedidoCliente() {
  if (carrito.length === 0) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18);
  doc.text("Pedido - MercadoTAO", 14, 20);
  
  const filas = carrito.map(i => [
    i.codigo, 
    i.nombre, 
    i.cantidad, 
    `$${i.precio.toLocaleString()}`, 
    `$${(i.precio * i.cantidad).toLocaleString()}`
  ]);

  doc.autoTable({
    startY: 30,
    head: [['Cód', 'Producto', 'Cant', 'Precio U.', 'Subtotal']],
    body: filas,
  });

  const subtotal = carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0);
  let totalFinal = subtotal;
  doc.setFontSize(14);
  
  if (subtotal >= 100000) {
    totalFinal = subtotal * 0.90;
    doc.setTextColor(39, 174, 96); // Color verde para el descuento
    doc.text(`Subtotal: $${subtotal.toLocaleString()}`, 14, doc.lastAutoTable.finalY + 10);
    doc.text(`DESCUENTO 10%: -$${(subtotal * 0.10).toLocaleString()}`, 14, doc.lastAutoTable.finalY + 17);
    doc.text(`TOTAL FINAL: $${totalFinal.toLocaleString()}`, 14, doc.lastAutoTable.finalY + 25);
  } else {
    doc.text(`Total del pedido: $${totalFinal.toLocaleString()}`, 14, doc.lastAutoTable.finalY + 10);
  }
  descargarPDF(doc, "Mi_Pedido_TAO.pdf");
}

async function generarPDFParaImprimir() {
  const aviso = document.createElement("div");
  aviso.id = "aviso-pdf";
  aviso.innerHTML = "Generando PDF, por favor espere...";
  aviso.style = "position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); color:white; padding:20px; border-radius:10px; z-index:5000; font-weight:bold;";
  document.body.appendChild(aviso);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');

  // CONFIGURACIÓN 4x4
  const marginX = 10; 
  const marginY = 25; 
  const gap = 2; 
  const cardW = (210 - (marginX * 2) - (gap * 3)) / 4; 
  const cardH = 65; 
  const productosPorHoja = 16; 
  const lista = filtrados;

  for (let i = 0; i < lista.length; i++) {
    const p = lista[i];
    const indexEnHoja = i % productosPorHoja;

    if (i > 0 && indexEnHoja === 0) {
      // Footer de cada hoja antes de pasar a la siguiente
      doc.setFontSize(11);
      doc.setTextColor(230, 126, 34);
      doc.setFont(undefined, 'bold');
      doc.text("CUALQUIER CONSULTA COMUNICARSE CON SEBASTIAN AL 351-6148905", 105, 289, { align: 'center' });
      doc.addPage();
    }

    // HEADER DE HOJA
    if (indexEnHoja === 0) {
      const logoData = await aplanarImagenProporcional('logo.png', 55, 15);
      if (logoData) {
        doc.addImage(logoData.data, 'JPEG', 105 - (logoData.w / 2), 4, logoData.w, logoData.h);
      }
      doc.setFontSize(12); doc.setTextColor(39, 174, 96); doc.setFont(undefined, 'bold');
      doc.text("10% de descuento para compras mayores a $100.000 (podes combinar los artículos)", 105, 21, { align: 'center' });
    }

    const col = indexEnHoja % 4;
    const fila = Math.floor(indexEnHoja / 4);
    const x = marginX + (col * (cardW + gap));
    const y = marginY + (fila * cardH);

    // Borde ficha
    doc.setLineWidth(0.1); 
    doc.setDrawColor(200); 
    doc.rect(x, y, cardW, cardH - 1);

   // CÓDIGO (Debajo de la foto, alineado a la izquierda)
    doc.setFont(undefined, 'normal'); 
    doc.setFontSize(8); 
    doc.setTextColor(100);
    // x + 5 lo separa un poco del borde izquierdo, y + 48 lo baja tras la foto
    doc.text(`Cód: ${p.codigo}`, x + 5, y + 47);

    // IMAGEN (42x42 para que no toque bordes)
    const imgUrl = obtenerImagen(p.imagen);
    try {
      const imgRes = await aplanarImagenProporcional(imgUrl, 42, 42);
      if (imgRes) {
        doc.addImage(imgRes.data, 'JPEG', x + ((cardW - 40) / 2), y + 2, 40, 40);
      }
    } catch (e) {}

    // NOMBRE CON AUTO-AJUSTE
    let nombreSeguro = String(p.nombre).replace(/[″”“]/g, '"').replace(/[′’‘]/g, "'").trim();
    let fontSizeTit = 9; 
    doc.setFontSize(fontSizeTit);
    doc.setFont(undefined, 'bold');
    doc.setTextColor(30);

    let lineasNombre = doc.splitTextToSize(nombreSeguro, cardW - 4);
    if (lineasNombre.length > 2) {
        fontSizeTit = 7;
        doc.setFontSize(fontSizeTit);
        lineasNombre = doc.splitTextToSize(nombreSeguro, cardW - 4);
    }
    doc.text(lineasNombre.slice(0, 3), x + (cardW / 2), y + 51, { align: 'center', lineHeightFactor: 1.0 });

    
    // LEYENDA DE ESTADO (Colores originales del index)
    let colorTexto = [100, 100, 100]; // Gris por defecto
    let textoMostrar = p.estado;
    
    if (p.estado.includes("CON STOCK")) {
        colorTexto = [0, 112, 192]; // Azul (#0070c0)
    } else if (p.estado.includes("ULTIMOS")) {
        colorTexto = [231, 76, 60]; // Rojo (#e74c3c)
        textoMostrar = "ULTIMOS DISPONIBLES"; // Sin el número de stock
    } else if (p.estado.includes("A PEDIDO")) {
        colorTexto = [230, 126, 34]; // Naranja (#e67e22)
    }

    doc.setFontSize(7);
    doc.setTextColor(colorTexto[0], colorTexto[1], colorTexto[2]);
    doc.setFont(undefined, 'bold');
    doc.text(textoMostrar, x + (cardW / 2), y + 58, { align: 'center' });

    // PRECIO
    doc.setFontSize(11); doc.setTextColor(39, 174, 96); doc.setFont(undefined, 'bold');
    doc.text(`$${Number(p.precio).toLocaleString("es-AR")}`, x + (cardW / 2), y + 63, { align: 'center' });
  }

  // Footer última hoja
  doc.setFontSize(11);
  doc.setTextColor(230, 126, 34);
  doc.setFont(undefined, 'bold');
  doc.text("CUALQUIER CONSULTA COMUNICARSE CON SEBASTIAN AL 351-6148905", 105, 289, { align: 'center' });

  descargarPDF(doc, "Catalogo_TAO_Imprimir.pdf");
  aviso.remove();
}

function aplanarImagenProporcional(url, maxW, maxH) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.onload = () => {
      const canvas = document.createElement("canvas");
      let w = img.width, h = img.height;
      const ratio = Math.min(maxW / w, maxH / h);
      w *= ratio; h *= ratio;
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      try {
        resolve({ data: canvas.toDataURL("image/jpeg", 0.8), w: w, h: h, offsetX: (maxW - w) / 2, offsetY: (maxH - h) / 2 });
      } catch (e) {
        resolve(null); // canvas "tainted" por CORS: seguimos sin esa imagen en vez de colgar el PDF
      }
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

function ejecutarFiltros() {
  const texto = document.getElementById("buscador").value.toLowerCase();
  const catSeleccionada = document.getElementById("filtro-categoria").value;

filtrados = productos.filter(p => {
    // Convertimos el stock a número limpiando posibles espacios
    const valorStock = (p.stock === undefined || p.stock === null || p.stock === "") ? 0 : Number(p.stock);
    
    // Si el valor no es un número válido o es 0 o menor, NO pasa el filtro
    if ((isNaN(valorStock) || valorStock <= 0) && !p.estado.includes("A PEDIDO")) return false;

    const coincideTexto = p.nombre.toLowerCase().includes(texto) || 
                          String(p.codigo).includes(texto);
    
    const coincideCat = (catSeleccionada === "todos") || (p.categoria === catSeleccionada);
    
    return coincideTexto && coincideCat;
  });
  render();
}

// Vinculamos los eventos
document.getElementById("buscador").oninput = ejecutarFiltros;
document.getElementById("filtro-categoria").onchange = ejecutarFiltros;

  async function confirmarImpresion() {
  // Cerramos el menú
  document.getElementById('modal-print-options').style.display = 'none';

  // Leemos qué estados quieres imprimir
  const verStock = document.getElementById('p-stock').checked;
  const verUltimos = document.getElementById('p-ultimos').checked;
  const verPedido = document.getElementById('p-pedido').checked;

  // Guardamos la lista actual para no romper lo que el usuario ve en la web
  const listaOriginalFiltrados = [...filtrados];

  // Filtramos temporalmente la lista solo para el PDF
  filtrados = filtrados.filter(p => {
    const est = p.estado.toUpperCase();
    if (est.includes("CON STOCK") && !verStock) return false;
    if (est.includes("ULTIMOS") && !verUltimos) return false;
    if (est.includes("A PEDIDO") && !verPedido) return false;
    return true;
  });

  // Si no quedó nada para imprimir, avisamos
  if (filtrados.length === 0) {
    alert("No hay productos que coincidan con los estados seleccionados.");
    filtrados = listaOriginalFiltrados;
    return;
  }

  // Llamamos a la función de imprimir (que ya usa la variable 'filtrados')
  try {
    await generarPDFParaImprimir();
  } catch (e) {
    console.error("Error generando el PDF:", e);
    alert("No se pudo generar el PDF. Por favor intentá de nuevo.");
  } finally {
    // Pase lo que pase: sacamos el cartel de "Generando PDF" y restauramos
    // la lista original en pantalla para que no desaparezcan productos de la web.
    const avisoPendiente = document.getElementById('aviso-pdf');
    if (avisoPendiente) avisoPendiente.remove();
    filtrados = listaOriginalFiltrados;
    render();
  }
}
